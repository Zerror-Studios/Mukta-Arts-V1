version: 1
frontend:
  phases:
    preBuild:
      commands:
        # package-lock.json is written by npm 11; npm 10 reads its optional TypeScript peers differently and npm ci fails
        - nvm install 22
        - nvm use 22
        - npm install -g npm@11
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
