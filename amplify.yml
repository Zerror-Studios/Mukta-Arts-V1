version: 1
frontend:
  phases:
    preBuild:
      commands:
        # package-lock.json is written by npm 11; npm 10 reads its optional TypeScript peers differently and npm ci fails
        - nvm install 22
        - nvm use 22
        - npm install -g npm@11
        - npm ci
    build:
      commands:
        # Amplify's environment variables only exist during the build, not when the API routes run. Copy the ones
        # /api/script-submission reads at request time into .env.production so Next.js bundles them for the server.
        - env | grep -E '^(NEXT_PUBLIC_)?(SANITY_API_WRITE_TOKEN|EMAIL_USER|EMAIL_PASS|CLIENT_EMAIL|EMAIL_FROM|SMTP_HOST|SMTP_PORT|SMTP_SECURE|SCRIPT_ATTACH_LIMIT_MB)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
